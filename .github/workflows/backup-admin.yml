name: backup-admin
run-name: Make backup of HYC results admin DB
on:
  workflow_dispatch:
  schedule:
      - cron: 12 6 * * *
permissions:
  contents: write
  pull-requests: write
jobs:
  create-admin-backup-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/admin/requirements.txt
      - name: Update admin DB backup
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          pip install -r scripts/admin/requirements.txt
          rm -f sources/reshyc/admin/202{5,6}_*.csv
          make admin-backup
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Admin DB backup
          title: Admin DB backup
          add-paths: sources/reshyc/admin/
          branch: create-pull-request/admin-backup
      - name: Merge pull request
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # GitHub computes mergeability asynchronously and we ask barely a
          # second after the branch is pushed; merging too early fails with a
          # spurious "Base branch was modified". Wait for it to settle.
          pr=${{ steps.cpr.outputs.pull-request-number }}
          for attempt in 1 2 3 4 5; do
            state=$(gh pr view "$pr" --json mergeable --jq .mergeable || echo UNKNOWN)
            if [ "$state" = MERGEABLE ] && gh pr merge --rebase "$pr"; then
              exit 0
            fi
            echo "attempt $attempt did not merge (mergeable=$state); retrying in 15s"
            sleep 15
          done
          echo "::error::could not merge PR $pr after 5 attempts"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Delete pull request branch
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: git push origin :create-pull-request/admin-backup
        env:
          GH_TOKEN: ${{ github.token }}
