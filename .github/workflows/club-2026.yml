# 2026 club-racing demo: the blocked sub-series import.
#
# Separate from `as-published.yml` because it ingests a different kind of
# thing: that workflow pushes the archival record, this one builds
# **full-fidelity** series from the club's own Sailwave files.
#
# Both are re-runnable, by the same trick from opposite ends. As-published is
# idempotent server-side on the document hash. Here it is the ids: every one is
# UUIDv5 over a stable key, so the merge is byte-reproducible, and
# `series import --replace` upserts each file at the id it carries. A re-run
# over changed .blw files therefore *updates* the series rather than landing a
# second copy — which is what a plain `series import` would do, since it mints
# a fresh series id per call and deduplicates only a byte-identical replay.
#
# Secrets:
#   APP_REPO_TOKEN              read access to sailscoring/sailscoring
#   SAILSCORING_ARCHIVIST_TOKEN the hyc workspace's API key
name: club-2026

on:
  push:
    branches: [main]
    paths:
      - 'sources/blw/**'
      - 'club-2026/**'
      - 'scripts/merge-club-series.ts'
      - 'scripts/verify-club-merge.ts'
      - '.github/workflows/club-2026.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SAILSCORING_TOKEN: ${{ secrets.SAILSCORING_ARCHIVIST_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: sailscoring/sailscoring
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install archive dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Merge the club series
        run: pnpm merge-club-series

      # Every id is UUIDv5 over a stable key and the export stamp is derived
      # from the racing, so a re-run over unchanged .blw files is byte-identical.
      # A diff here means either the inputs changed without the output being
      # committed, or something non-deterministic crept back in — and a file
      # that changes for no reason imports as a duplicate series.
      - name: Built series are committed and reproducible
        run: git diff --exit-code club-2026/

      # Informational. The demo knowingly diverges from the source files: a
      # merged series has one competitor set, so per-block entry lists don't
      # survive and DNC-derived points move (CLARIFICATIONS.md, app #368).
      # Printed on every run so a *new* divergence is visible in the log.
      - name: Fidelity report
        continue-on-error: true
        run: |
          for f in club-2026/*.sailscoring; do
            g=$(basename "$f" .sailscoring)
            echo "::group::$g"
            pnpm verify-club-merge "$f" \
              "sources/blw/2026/$g/series-1.blw" \
              "sources/blw/2026/$g/series-2.blw" \
              "sources/blw/2026/$g/series-3.blw" || true
            echo "::endgroup::"
          done

      # `--replace` is what makes this safe to run on every push: each file
      # upserts at its own id, so an updated .blw replaces the series rather
      # than adding another. Without it, every changed file would be a new
      # series in the workspace.
      - name: Import into the workspace
        if: env.SAILSCORING_TOKEN != ''
        working-directory: app
        run: pnpm cli series import ${{ github.workspace }}/club-2026/*.sailscoring --workspace hyc --replace
