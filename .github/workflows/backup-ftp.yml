name: backup-ftp
run-name: Make backup of HYC results FTP folder
on:
  workflow_dispatch:
  schedule:
      - cron: 38 7 * * *
permissions:
  contents: write
  pull-requests: write
jobs:
  create-ftp-backup-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          FTP_DIR: reshyc
          FTP_SERVER: results.hyc.ie
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: make backup
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: FTP backup
          title: FTP backup
          add-paths: sources/reshyc/results.hyc.ie/
          branch: create-pull-request/ftp-backup
      - name: Merge pull request
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # GitHub computes mergeability asynchronously and we ask barely a
          # second after the branch is pushed; merging too early fails with a
          # spurious "Base branch was modified". Wait for it to settle.
          pr=${{ steps.cpr.outputs.pull-request-number }}
          for attempt in 1 2 3 4 5; do
            state=$(gh pr view "$pr" --json mergeable --jq .mergeable || echo UNKNOWN)
            if [ "$state" = MERGEABLE ] && gh pr merge --rebase "$pr"; then
              exit 0
            fi
            echo "attempt $attempt did not merge (mergeable=$state); retrying in 15s"
            sleep 15
          done
          echo "::error::could not merge PR $pr after 5 attempts"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Delete pull request branch
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: git push origin :create-pull-request/ftp-backup
        env:
          GH_TOKEN: ${{ github.token }}
